name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Quartz engine
        run: |
          git clone --depth 1 https://github.com/jackyzha0/quartz.git quartz-engine
          cd quartz-engine
          npm ci
          npx quartz plugin install

      - name: Use custom config
        run: cp publish/quartz.config.yaml quartz-engine/quartz.config.yaml

      - name: Symlink content
        run: ln -s "${{ github.workspace }}" quartz-engine/content

      - name: Build Quartz
        run: |
          ln -s "${{ github.workspace }}" "${{ runner.temp }}/content"
          cd quartz-engine
          npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-engine/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4