name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: content-src
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Quartz engine
        run: |
          git clone --depth 1 https://github.com/jackyzha0/quartz.git quartz-engine
          cd quartz-engine
          npm ci
          npx quartz plugin install --from-config

      - name: Use custom config
        run: cp content-src/publish/quartz.config.yaml quartz-engine/quartz.config.yaml

      - name: Copy content into engine
        run: |
          cp -R content-src/. quartz-engine/content/
          rm -rf quartz-engine/content/.git quartz-engine/content/.obsidian quartz-engine/content/publish quartz-engine/content/.DS_Store

      - name: Set wiki/首页 as homepage
        run: |
          mv quartz-engine/content/index.md quartz-engine/content/索引.md
          cp quartz-engine/content/wiki/首页.md quartz-engine/content/index.md
          rm -f quartz-engine/content/wiki/首页.md
          python3 - <<'EOF'
import pathlib, re
pattern = re.compile(r'\[\[index\|([^\]]*)\]\]|\[\[index\]\]')
for p in pathlib.Path('quartz-engine/content').rglob('*.md'):
    text = p.read_text()
    new = pattern.sub(lambda m: f'[[索引]]', text)
    if new != text:
        p.write_text(new)
        print(f'rewritten: {p}')
EOF
          ls quartz-engine/content/

      - name: Build Quartz
        run: |
          cd quartz-engine
          npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-engine/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4